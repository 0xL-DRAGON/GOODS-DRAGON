[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goods-dragon"
version = "2.0.0"
description = "Advanced Pentesting & Bug Bounty Framework"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "0xL-DRAGON", email = "L-DRAGON.support@gmail.com"}
]
maintainers = [
    {name = "L-DRAGON Team"}
]
keywords = ["pentesting", "bugbounty", "security", "vulnerability-scanner", "hacking", "osint"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests",
    "dnspython",
    "flask",
    "beautifulsoup4",
    "rich",
]

[project.urls]
Homepage = "https://github.com/0xL-DRAGON/GOODS-DRAGON"
Documentation = "https://github.com/0xL-DRAGON/GOODS-DRAGON#readme"
Repository = "https://github.com/0xL-DRAGON/GOODS-DRAGON.git"
Issues = "https://github.com/0xL-DRAGON/GOODS-DRAGON/issues"

[project.scripts]
dragon = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "modules*", "utils*", "webui*", "scripts*"]
